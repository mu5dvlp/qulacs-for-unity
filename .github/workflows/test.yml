name: Test

on:
  push:
    branches: [main]
    paths:
      - "Packages/com.mu5dvlp.qulacs/Runtime/**/*.cs"
      - "Packages/com.mu5dvlp.qulacs/Tests/**/*.cs"
      - "Packages/com.mu5dvlp.qulacs/dotnet~/**"
      - "Packages/com.mu5dvlp.qulacs/Runtime/Plugins/Windows/x86_64/qulacs_unity.dll"
      - ".github/workflows/test.yml"
  # "dotnet test" is a required status check on main. Combining a required check
  # with a pull_request `paths` filter makes the job never start for PRs that only
  # touch files outside the filter (e.g. Linux / other-platform binary updates,
  # build scripts, CI changes), so the required check stays pending forever and the
  # PR cannot be merged. Therefore do NOT filter pull_request by path — always run.
  # push keeps its `paths` filter to save CI minutes.
  pull_request:
    branches: [main, dev]
  # Manual re-run escape hatch (normally unnecessary).
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: dotnet test
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Packages/com.mu5dvlp.qulacs/dotnet~/Mu5dvlp.Qulacs.Tests.csproj

      - name: Build
        run: dotnet build Packages/com.mu5dvlp.qulacs/dotnet~/Mu5dvlp.Qulacs.Tests.csproj --no-restore

      - name: Test
        run: >-
          dotnet test Packages/com.mu5dvlp.qulacs/dotnet~/Mu5dvlp.Qulacs.Tests.csproj
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
