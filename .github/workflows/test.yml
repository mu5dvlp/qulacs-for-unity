name: Test

on:
  push:
    branches: [main]
    paths:
      - "Packages/com.mu5dvlp.qulacs/Runtime/**/*.cs"
      - "Packages/com.mu5dvlp.qulacs/Tests/**/*.cs"
      - "Packages/com.mu5dvlp.qulacs/dotnet~/**"
      - "Packages/com.mu5dvlp.qulacs/Runtime/Plugins/Windows/x86_64/qulacs_unity.dll"
      - ".github/workflows/test.yml"
  # "dotnet test" は main の必須ステータスチェック。必須チェックに pull_request の
  # pathフィルタを併用すると、フィルタ外の変更だけの PR (例: Linux/他プラット
  # フォームのバイナリ更新、ビルドスクリプトや CI の変更) でジョブが一度も起動せず、
  # 必須チェックが永久に pending になりマージ不能になる。よって pull_request では
  # pathフィルタを使わず常に実行する。push はコスト削減のため pathフィルタを維持。
  pull_request:
    branches: [main, dev]
  # 手動再実行用のエスケープハッチ (通常は不要)。
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: dotnet test
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Packages/com.mu5dvlp.qulacs/dotnet~/Mu5dvlp.Qulacs.Tests.csproj

      - name: Build
        run: dotnet build Packages/com.mu5dvlp.qulacs/dotnet~/Mu5dvlp.Qulacs.Tests.csproj --no-restore

      - name: Test
        run: >-
          dotnet test Packages/com.mu5dvlp.qulacs/dotnet~/Mu5dvlp.Qulacs.Tests.csproj
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
